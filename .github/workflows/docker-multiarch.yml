name: Build Zephyr Docker Image

# Builds each architecture on a native runner - no emulation. Rosetta's syscall
# translation breaks GNU tar (mkdir/symlink return ENOSYS), which takes out both
# the Zephyr SDK and J-Link unpack steps, and QEMU is slow enough to be painful.
# ubuntu-24.04 is amd64, ubuntu-24.04-arm is arm64; both are free on public repos.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Bake target to build
        type: choice
        default: v4_4_0
        options: [v4_4_0, v4_3_0, v3_7_1, v3_7_0]
  push:
    tags: ['v*']

env:
  REPO: lukecorb/sig_zephyr

jobs:
  # Single source of truth: read the versions out of docker-bake.hcl rather than
  # duplicating the version -> SDK mapping here.
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      zephyr_version: ${{ steps.bake.outputs.zephyr_version }}
      sdk_version: ${{ steps.bake.outputs.sdk_version }}
      jlink_version: ${{ steps.bake.outputs.jlink_version }}
      tag: ${{ steps.bake.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: bake
        env:
          TARGET: ${{ inputs.target || 'v4_4_0' }}
        run: |
          json=$(docker buildx bake --print "$TARGET")
          t=$(echo "$json" | jq -r --arg k "$TARGET" '.target[$k]')
          {
            echo "zephyr_version=$(echo "$t" | jq -r '.args.ZEPHYR_VERSION')"
            echo "sdk_version=$(echo "$t" | jq -r '.args.ZEPHYR_SDK_VERSION')"
            echo "jlink_version=$(echo "$t" | jq -r '.args.JLINK_VERSION')"
            echo "tag=$(echo "$t" | jq -r '.tags[0]')"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # The image is ~9.7 GB; a stock runner does not have room for it plus the
      # build cache. This reclaims roughly 20-30 GB of preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # push-by-digest: each runner pushes an unnamed, single-arch image. The
      # merge job below binds the digests together under the real tag.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            ZEPHYR_VERSION=${{ needs.prepare.outputs.zephyr_version }}
            ZEPHYR_SDK_VERSION=${{ needs.prepare.outputs.sdk_version }}
            JLINK_VERSION=${{ needs.prepare.outputs.jlink_version }}
          outputs: type=image,name=${{ env.REPO }},push-by-digest=true,name-canonical=true,push=true
          # Registry cache, not type=gha: the GitHub cache is capped at 10 GB per
          # repo, which this image would blow through on its own.
          cache-from: type=registry,ref=${{ env.REPO }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REPO }}:buildcache-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t "${{ needs.prepare.outputs.tag }}" \
            $(printf "${{ env.REPO }}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ needs.prepare.outputs.tag }}"
